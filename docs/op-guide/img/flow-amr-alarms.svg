<text x="466.0" y="468.0" font-family="Microsoft JhengHei, PMingLiU, Noto Sans TC, sans-serif" font-size="14" fill="#052E16" text-anchor="middle"><tspan x="466.0" dy="0">1. 確認 AMR 已離開該站</tspan><tspan x="466.0" dy="20">2. 站台已清空 / 已補好</tspan><tspan x="466.0" dy="20">3. 選 RETRY → START</tspan><tspan x="466.0" dy="20">4. 通知 EAP 連線異常</tspan></text>
