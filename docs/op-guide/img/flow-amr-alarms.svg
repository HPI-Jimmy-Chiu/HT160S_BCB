<text x="174.0" y="468.0" font-family="Microsoft JhengHei, PMingLiU, Noto Sans TC, sans-serif" font-size="14" fill="#052E16" text-anchor="middle"><tspan x="174.0" dy="0">1. 聯絡 AMR / EAP 控制室確認派車</tspan><tspan x="174.0" dy="20">2. 車到、交接完成後</tspan><tspan x="174.0" dy="20">   選 RETRY → START</tspan><tspan x="174.0" dy="20">   （機台重新叫車）</tspan></text>
